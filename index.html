<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthonny Santos | Engenharia de Áudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .project-card { aspect-ratio: 1 / 1; }
        .hidden-item { display: none; }
    </style>
    <script>
        function filterSelection(category) {
            let items = document.getElementsByClassName("filter-item");
            for (let i = 0; i < items.length; i++) {
                if (category === 'all') {
                    items[i].classList.remove("hidden-item");
                } else {
                    if (items[i].classList.contains(category)) {
                        items[i].classList.remove("hidden-item");
                    } else {
                        items[i].classList.add("hidden-item");
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#121212] text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="py-20 text-center space-y-6">
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-widest text-white uppercase">Anthonny Santos</h1>
        
        <!-- Efeito Fade & Glow -->
        <div class="group flex flex-wrap justify-center items-center gap-2 text-sm md:text-base font-semibold tracking-wide text-gray-300">
            <span class="transition-all duration-500 cursor-pointer group-hover:text-gray-700 hover:!text-[#a855f7] hover:!drop-shadow-[0_0_12px_rgba(168,85,247,0.9)]">Engenharia de Mixagem</span>
            <span class="text-gray-700">|</span>
            <span class="transition-all duration-500 cursor-pointer group-hover:text-gray-700 hover:!text-[#a855f7] hover:!drop-shadow-[0_0_12px_rgba(168,85,247,0.9)]">Produção Musical</span>
            <span class="text-gray-700">|</span>
            <span class="transition-all duration-500 cursor-pointer group-hover:text-gray-700 hover:!text-[#a855f7] hover:!drop-shadow-[0_0_12px_rgba(168,85,247,0.9)]">Pós-Produção</span>
        </div>
    </header>

    <!-- Filtros (Abas) -->
    <div class="flex flex-wrap justify-center gap-6 pb-12 px-4">
        <button onclick="filterSelection('all')" class="text-gray-400 hover:text-[#a855f7] transition-colors uppercase tracking-wider text-sm font-bold">Todos os Trabalhos</button>
        <button onclick="filterSelection('music')" class="text-gray-400 hover:text-[#a855f7] transition-colors uppercase tracking-wider text-sm font-bold">Música</button>
        <button onclick="filterSelection('audio-visual')" class="text-gray-400 hover:text-[#a855f7] transition-colors uppercase tracking-wider text-sm font-bold">Audiovisual & Dublagem</button>
    </div>

    <!-- Grid do Portfólio -->
    <main class="flex-grow container mx-auto px-4 pb-20">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            
            <!-- Projeto 1: Audimal -->
            <div class="filter-item music relative group bg-[#1a1a1a] project-card cursor-pointer border border-transparent hover:border-[#a855f7] transition-all duration-300">
                <div class="absolute inset-0 flex items-center justify-center text-gray-700 group-hover:text-[#a855f7] transition-colors">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                </div>
                <div class="absolute inset-0 bg-black bg-opacity-85 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 text-center">
                    <h3 class="text-white font-bold text-lg tracking-wide mb-1">Projeto Audimal</h3>
                    <p class="text-[#a855f7] text-xs uppercase tracking-widest">Produção & Mixagem</p>
                </div>
            </div>

            <!-- Projeto 2: Eis-me Aqui -->
            <div class="filter-item audio-visual relative group bg-[#1a1a1a] project-card cursor-pointer border border-transparent hover:border-[#a855f7] transition-all duration-300">
                <div class="absolute inset-0 flex items-center justify-center text-gray-700 group-hover:text-[#a855f7] transition-colors">
                     <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <div class="absolute inset-0 bg-black bg-opacity-85 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 text-center">
                    <h3 class="text-white font-bold text-lg tracking-wide mb-1">Eis-me Aqui</h3>
                    <p class="text-[#a855f7] text-xs uppercase tracking-widest">Edição de Áudio</p>
                </div>
            </div>
            
            <!-- Projeto 3: Documentário -->
            <div class="filter-item audio-visual relative group bg-[#1a1a1a] project-card cursor-pointer border border-transparent hover:border-[#a855f7] transition-all duration-300">
                <div class="absolute inset-0 flex items-center justify-center text-gray-700 group-hover:text-[#a855f7] transition-colors">
                     <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <div class="absolute inset-0 bg-black bg-opacity-85 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 text-center">
                    <h3 class="text-white font-bold text-lg tracking-wide mb-1">Documentário</h3>
                    <p class="text-[#a855f7] text-xs uppercase tracking-widest">Dublagem & Sound Design</p>
                </div>
            </div>

            <!-- Projeto 4: Exemplo -->
             <div class="filter-item music relative group bg-[#1a1a1a] project-card cursor-pointer border border-transparent hover:border-[#a855f7] transition-all duration-300">
                <div class="absolute inset-0 flex items-center justify-center text-gray-700 group-hover:text-[#a855f7] transition-colors">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="absolute inset-0 bg-black bg-opacity-85 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 text-center">
                    <h3 class="text-white font-bold text-lg tracking-wide mb-1">Trabalho Adicional</h3>
                    <p class="text-[#a855f7] text-xs uppercase tracking-widest">Mix & Master</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Rodapé & Contato -->
    <footer class="bg-black py-20 border-t border-gray-900">
        <div class="container mx-auto px-4 flex flex-col items-center">
            
            <!-- Botão de Briefing -->
            <a href="https://forms.gle/dpM31VCYpy1TJ16q8" target="_blank" rel="noopener noreferrer" 
               class="inline-block bg-[#a855f7] hover:bg-[#9333ea] text-white font-bold py-4 px-10 rounded shadow-[0_0_15px_rgba(168,85,247,0.3)] hover:shadow-[0_0_25px_rgba(168,85,247,0.6)] transition-all duration-300 mb-20 text-sm md:text-base uppercase tracking-widest">
                Solicitar Orçamento de Mix / Master
            </a>

            <!-- Formulário Secundário -->
            <div class="w-full max-w-md">
                <form class="space-y-4">
                    <input type="text" placeholder="Nome" class="w-full bg-[#121212] border border-gray-800 p-3 text-white focus:outline-none focus:border-[#a855f7] transition-colors">
                    <input type="email" placeholder="E-mail" class="w-full bg-[#121212] border border-gray-800 p-3 text-white focus:outline-none focus:border-[#a855f7] transition-colors">
                    <textarea placeholder="Mensagem..." rows="3" class="w-full bg-[#121212] border border-gray-800 p-3 text-white focus:outline-none focus:border-[#a855f7] transition-colors resize-none"></textarea>
                    <button type="button" class="w-full border border-gray-700 text-gray-400 hover:border-[#a855f7] hover:text-[#a855f7] font-bold py-3 px-4 transition-colors duration-300 uppercase tracking-widest text-xs">
                        Enviar
                    </button>
                </form>
            </div>
            
            <div class="mt-16 text-gray-700 text-xs tracking-widest uppercase">
                © 2026 Anthonny Santos
            </div>
        </div>
    </footer>

</body>
</html>
